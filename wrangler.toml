# ─── wrangler.toml ────────────────────────────────────────────────────────────
# Cloudflare Pages + Workers config for Astralearnia.
# Uses @opennextjs/cloudflare (NOT @cloudflare/next-on-pages).
#
# Deploy:
#   npx opennextjs-cloudflare build
#   wrangler pages deploy
# ─────────────────────────────────────────────────────────────────────────────

name                   = "astralearnia"
pages_build_output_dir = ".open-next/assets"    # opennextjs output dir

compatibility_date     = "2024-09-23"
compatibility_flags    = ["nodejs_compat"]

# ── D1 Database (comments + view counts) ─────────────────────────────────────
[[d1_databases]]
binding       = "DB"
database_name = "astralearnia-comments"
database_id   = "1b4b4535-8b78-4e94-93de-20f2121f231c"

# ── Environment variables ─────────────────────────────────────────────────────
[vars]
NEXT_PUBLIC_SITE_URL = "https://astralearnia.com"

[env.production.vars]
NEXT_PUBLIC_SITE_URL = "https://astralearnia.com"

[env.preview.vars]
NEXT_PUBLIC_SITE_URL = "https://preview.astralearnia.pages.dev"